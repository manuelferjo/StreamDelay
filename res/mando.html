<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#09090c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Mando · Vortexs Live</title>
<style>
  :root {
    --bg: #09090c; --surface: #111116; --elev: #171720; --border: #26262e; --border-hi: #38364a;
    --text: #f4f4f5; --muted: #a1a1aa; --dim: #71717a;
    --violet: #c09afd; --pale: #e3d5ff; --yellow: #ede103; --red: #ff4655; --green: #34d399;
    --grad: linear-gradient(120deg, var(--violet), var(--pale) 45%, var(--yellow));
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 15px/1.4 "Segoe UI", system-ui, -apple-system, sans-serif; min-height: 100vh;
    padding: max(14px, env(safe-area-inset-top)) 14px max(20px, env(safe-area-inset-bottom)); }
  .wrap { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  header { display: flex; align-items: center; gap: 10px; }
  .brand { font: 700 12px Consolas, "JetBrains Mono", monospace; letter-spacing: .18em; color: var(--muted); text-transform: uppercase; }
  .brand b { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .conn { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--dim); }
  .conn i { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
  .conn.ok i { background: var(--green); } .conn.bad i { background: var(--red); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 14px; }
  .lbl { font: 700 11px Consolas, monospace; letter-spacing: .14em; color: var(--dim); text-transform: uppercase; margin-bottom: 8px; }

  #alert { display: none; border-color: rgba(255,70,85,.55); background: rgba(255,70,85,.10); }
  #alert.show { display: block; animation: blink 1.2s ease-in-out 3; }
  @keyframes blink { 50% { background: rgba(255,70,85,.28); } }
  #alert .lbl { color: var(--red); }
  #alert div { font-weight: 600; color: #ffb3ba; }

  #hero { position: relative; overflow: hidden; text-align: center; padding: 18px 14px 16px; }
  #hero.on { border-color: rgba(255,70,85,.5); box-shadow: 0 0 40px rgba(255,70,85,.12) inset; }
  #state { font: 800 46px/1 "Segoe UI", system-ui, sans-serif; letter-spacing: -.02em; }
  #state small { font-size: 22px; margin-left: 4px; font-weight: 700; color: var(--muted); }
  #hero.on #state { color: #fff; }
  #hero.off #state { color: var(--muted); font-size: 34px; }
  #sub { margin-top: 8px; color: var(--muted); font-size: 13px; }
  #sub .live { color: var(--red); font-weight: 700; }
  .bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,.08); margin-top: 12px; overflow: hidden; display: none; }
  .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--red), #ff8a94); transition: width .9s linear; }
  #hero.tr .bar { display: block; }

  button { font: inherit; color: inherit; border: 0; cursor: pointer; touch-action: manipulation; }
  .big { width: 100%; padding: 18px; border-radius: 16px; font-size: 19px; font-weight: 800; }
  #toggle.go { background: var(--grad); color: #111; }
  #toggle.stop { background: var(--elev); border: 1px solid var(--red); color: #ff8a94; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .ghost { padding: 15px 10px; border-radius: 14px; background: var(--elev); border: 1px solid var(--border); font-size: 17px; font-weight: 700; }
  .ghost:active, .pre:active, .big:active { transform: scale(.98); filter: brightness(1.2); }
  #presets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .pre { padding: 13px 6px; border-radius: 999px; background: var(--elev); border: 1px solid var(--border); font-weight: 700; font-size: 15px; color: var(--muted); }
  .pre.sel { border-color: var(--violet); color: var(--text); background: rgba(192,154,253,.14); }
  .dest { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--border); }
  .dest:first-of-type { border-top: 0; }
  .dest b { flex: 1; }
  .chip { font-size: 12px; padding: 3px 10px; border-radius: 999px; background: var(--elev); color: var(--muted); white-space: nowrap; }
  .chip.live { color: #fff; background: rgba(255,70,85,.22); }
  .chip.retry { color: #111; background: var(--yellow); }
  .q { font: 600 11px Consolas, monospace; color: var(--dim); }
  .ev { display: flex; gap: 10px; font-size: 13px; padding: 5px 0; color: var(--muted); }
  .ev time { font-family: Consolas, monospace; color: var(--dim); flex: none; }
  .ev.bad span { color: #ff8a94; } .ev.ok span { color: var(--green); }
  #cut { position: relative; overflow: hidden; width: 100%; padding: 15px; border-radius: 14px; background: transparent; border: 1px solid rgba(255,70,85,.5); color: #ff8a94; font-weight: 800; font-size: 15px; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none; }
  #cut i { position: absolute; inset: 0; width: 0; background: rgba(255,70,85,.35); }
  #cut span { position: relative; }
  .foot { display: flex; justify-content: space-between; align-items: center; color: var(--dim); font-size: 12px; }
  .foot label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  #toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px); opacity: 0; transition: .25s; background: var(--elev); border: 1px solid var(--border-hi); padding: 9px 16px; border-radius: 999px; font-weight: 600; font-size: 14px; pointer-events: none; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .empty { color: var(--dim); font-size: 13px; }

  /* Modo QR (se abre desde el PC para escanear con el móvil) */
  #qrview { display: none; text-align: center; }
  body.qr #main { display: none; } body.qr #qrview { display: block; }
  #qr { background: #fff; padding: 16px; border-radius: 16px; display: inline-block; margin: 14px 0; }
  #qrurl { font-family: Consolas, monospace; word-break: break-all; color: var(--violet); font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="brand"><b>Vortexs Live</b> · Mando</span>
    <span class="conn" id="conn"><i></i><span id="connTxt">Conectando…</span></span>
  </header>

  <div id="qrview" class="card">
    <div class="lbl">Escanea con la cámara del móvil</div>
    <div id="qr"></div>
    <div id="qrurl"></div>
    <p class="empty" id="qrnote">El móvil tiene que estar en la misma wifi que este PC.</p>
  </div>

  <div id="main" class="wrap" style="padding:0">
    <div id="alert" class="card"><div class="lbl">⚠ Aviso</div><div id="alertTxt"></div></div>

    <div id="hero" class="card off">
      <div class="lbl" id="heroLbl">Delay</div>
      <div id="state">—</div>
      <div id="sub">—</div>
      <div class="bar"><i id="bar"></i></div>
    </div>

    <button id="toggle" class="big go">Activar delay</button>
    <div class="row">
      <button class="ghost" data-a="menos">− 5 s</button>
      <button class="ghost" data-a="mas">+ 5 s</button>
    </div>
    <button class="ghost" data-a="clip" style="width:100%;margin-top:10px">🎬 Guardar clip (últimos 60 s)</button>

    <div class="card"><div class="lbl">Delays guardados</div><div id="presets"></div></div>
    <div class="card"><div class="lbl">Destinos</div><div id="dests"><div class="empty">—</div></div></div>
    <div class="card"><div class="lbl">Últimos avisos</div><div id="events"><div class="empty">Todo en orden.</div></div></div>

    <button id="cut"><i></i><span>Mantén pulsado para CORTAR YA</span></button>
    <div class="foot">
      <label><input type="checkbox" id="snd"> Sonido de aviso en este dispositivo</label>
      <span id="ver"></span>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
(function () {
  var q = new URLSearchParams(location.search);
  // Idioma: lo pone Vortexs Live al enviar la página ('es' o 'en').
  var LANG = ('__SD_LANG__' === 'en' || q.get('lang') === 'en') ? 'en' : 'es';
  var EN_TXT = {
    'Mando · Vortexs Live': 'Remote · Vortexs Live',
    'Mando': 'Remote',
    '· Mando': '· Remote',
    'Conectando…': 'Connecting…',
    'Escanea con la cámara del móvil': "Scan with your phone's camera",
    'El móvil tiene que estar en la misma wifi que este PC.': 'The phone must be on the same Wi-Fi as this PC.',
    '⚠ Aviso': '⚠ Warning',
    'Activar delay': 'Turn delay on',
    'Quitar delay': 'Turn delay off',
    '🎬 Guardar clip (últimos 60 s)': '🎬 Save clip (last 60 s)',
    'Delays guardados': 'Saved delays',
    'Destinos': 'Destinations',
    'Últimos avisos': 'Latest alerts',
    'Todo en orden.': 'All good.',
    'Mantén pulsado para CORTAR YA': 'Hold to CUT NOW',
    'Sonido de aviso en este dispositivo': 'Alert sound on this device',
    'Primero activa <b>Permitir desde el móvil</b> en Vortexs Live → pestaña Mando, y vuelve a pulsar «Código QR».': 'First turn on <b>Allow from phone</b> in Vortexs Live → Remote tab, and click «QR code» again.',
    'No se pudo dibujar el QR: escribe la dirección de arriba en el navegador del móvil.': "Couldn't draw the QR: type the address above in your phone's browser.",
    'En directo': 'Live', 'Reintentando': 'Retrying', 'Conectando': 'Connecting', 'Esperando': 'Waiting', 'Preparado': 'Ready', 'Sin clave': 'No key', 'Parado': 'Stopped',
    'Activando delay': 'Delay going on', 'Subiendo delay': 'Delay going up', 'Bajando delay': 'Delay going down', 'Delay quitado': 'Delay removed',
    'Delay activado': 'Delay on',
    'Sin delay': 'No delay',
    'Servicio parado en Vortexs Live': 'Service stopped in Vortexs Live',
    'Esperando a OBS…': 'Waiting for OBS…',
    ' en ': ' on ',
    ' plataforma': ' platform',
    ' plataformas': ' platforms',
    ' · tu público va ': ' · your viewers are ',
    ' s por detrás': ' s behind',
    'OBS conectado · llenando el delay': 'OBS connected · filling the delay',
    'No hay destinos activados.': 'No destinations turned on.',
    'Conectado': 'Connected',
    'Sin conexión con Vortexs Live': 'No connection to Vortexs Live',
    'No se pudo contactar con Vortexs Live': "Couldn't reach Vortexs Live",
    'Clave incorrecta: copia de nuevo la URL': 'Wrong key: copy the URL again'
  };
  function T(s) { return (LANG === 'en' && EN_TXT[s]) || s; }
  if (LANG === 'en') {
    document.documentElement.lang = 'en';
    document.title = T(document.title);
    (function walk(n) {
      if (n.nodeType === 3) { var k = n.nodeValue.trim(); if (k && EN_TXT[k]) n.nodeValue = n.nodeValue.replace(k, EN_TXT[k]); return; }
      if (n.nodeType !== 1 || n.tagName === 'SCRIPT' || n.tagName === 'STYLE') return;
      for (var c = n.firstChild; c; c = c.nextSibling) walk(c);
    })(document.body);
  }
  var K = q.get('k') || '';
  var API = '/mando/api?k=' + encodeURIComponent(K) + '&a=';
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function secs(n) { return n >= 60 && n % 60 === 0 ? (n / 60) + '<small>min</small>' : n + '<small>s</small>'; }

  // ---------- Generador de códigos QR (sin internet) ----------
  // Norma ISO/IEC 18004: modo byte (UTF-8), corrección de errores M, versiones 1–10 (hasta 213 bytes).
  // QR.matrix(texto[, máscara]) -> filas de true/false · QR.svg(texto, px) -> imagen SVG.
  var QR = (function () {
    var ECC = [0, 10, 16, 26, 18, 24, 16, 18, 22, 22, 26];   // bytes de corrección por bloque (nivel M)
    var BLOCKS = [0, 1, 1, 1, 2, 2, 4, 4, 4, 5, 5];          // nº de bloques (nivel M)
    function rawModules(v) {
      var r = (16 * v + 128) * v + 64;
      if (v >= 2) { var n = Math.floor(v / 7) + 2; r -= (25 * n - 10) * n - 55; if (v >= 7) r -= 36; }
      return r;
    }
    function dataBytes(v) { return Math.floor(rawModules(v) / 8) - ECC[v] * BLOCKS[v]; }
    function alignPos(v) {
      if (v === 1) return [];
      var n = Math.floor(v / 7) + 2, step = Math.ceil((v * 4 + 4) / (n * 2 - 2)) * 2, r = [6];
      for (var p = v * 4 + 10; r.length < n; p -= step) r.splice(1, 0, p);
      return r;
    }
    function mul(x, y) {
      var z = 0;
      for (var i = 7; i >= 0; i--) { z = (z << 1) ^ ((z >>> 7) * 0x11D); z ^= ((y >>> i) & 1) * x; }
      return z;
    }
    function divisor(d) {
      var r = []; for (var i = 0; i < d; i++) r.push(0); r[d - 1] = 1;
      var root = 1;
      for (i = 0; i < d; i++) {
        for (var j = 0; j < d; j++) { r[j] = mul(r[j], root); if (j + 1 < d) r[j] ^= r[j + 1]; }
        root = mul(root, 2);
      }
      return r;
    }
    function remainder(data, div) {
      var r = div.map(function () { return 0; });
      data.forEach(function (b) {
        var f = b ^ r.shift(); r.push(0);
        div.forEach(function (c, i) { r[i] ^= mul(c, f); });
      });
      return r;
    }
    function utf8(s) {
      var b = [], e = unescape(encodeURIComponent(s));
      for (var i = 0; i < e.length; i++) b.push(e.charCodeAt(i));
      return b;
    }
    function matrix(text, forceMask) {
      var bytes = utf8(text), v;
      for (v = 1; v <= 10; v++) if (4 + (v < 10 ? 8 : 16) + bytes.length * 8 <= dataBytes(v) * 8) break;
      if (v > 10) throw new Error('texto demasiado largo para el QR');
      // Bits de datos: modo byte, longitud, bytes, fin y relleno.
      var bits = [];
      function put(val, n) { for (var i = n - 1; i >= 0; i--) bits.push((val >>> i) & 1); }
      put(4, 4); put(bytes.length, v < 10 ? 8 : 16);
      bytes.forEach(function (b) { put(b, 8); });
      var cap = dataBytes(v) * 8;
      put(0, Math.min(4, cap - bits.length));
      put(0, (8 - bits.length % 8) % 8);
      for (var pad = 0xEC; bits.length < cap; pad ^= 0xEC ^ 0x11) put(pad, 8);
      var data = [];
      for (var i = 0; i < bits.length; i += 8) { var x = 0; for (var k = 0; k < 8; k++) x = (x << 1) | bits[i + k]; data.push(x); }
      // Corrección de errores (Reed-Solomon) e intercalado de bloques.
      var nb = BLOCKS[v], ecl = ECC[v], raw = Math.floor(rawModules(v) / 8);
      var nShort = nb - raw % nb, shortLen = Math.floor(raw / nb), div = divisor(ecl), blocks = [], at = 0;
      for (i = 0; i < nb; i++) {
        var d = data.slice(at, at + shortLen - ecl + (i < nShort ? 0 : 1)); at += d.length;
        var e = remainder(d, div);
        if (i < nShort) d.push(0);
        blocks.push(d.concat(e));
      }
      var cw = [];
      for (i = 0; i < blocks[0].length; i++)
        for (var j = 0; j < nb; j++) if (i !== shortLen - ecl || j >= nShort) cw.push(blocks[j][i]);
      // Patrones fijos.
      var size = v * 4 + 17, m = [], fn = [];
      for (i = 0; i < size; i++) { m.push([]); fn.push([]); for (j = 0; j < size; j++) { m[i].push(false); fn[i].push(false); } }
      function set(x, y, dark) { m[y][x] = dark; fn[y][x] = true; }
      for (i = 0; i < size; i++) { set(6, i, i % 2 === 0); set(i, 6, i % 2 === 0); }
      [[3, 3], [size - 4, 3], [3, size - 4]].forEach(function (c) {
        for (var dy = -4; dy <= 4; dy++) for (var dx = -4; dx <= 4; dx++) {
          var dist = Math.max(Math.abs(dx), Math.abs(dy)), xx = c[0] + dx, yy = c[1] + dy;
          if (xx >= 0 && xx < size && yy >= 0 && yy < size) set(xx, yy, dist !== 2 && dist !== 4);
        }
      });
      var ap = alignPos(v), last = ap.length - 1;
      ap.forEach(function (ax, ai) {
        ap.forEach(function (ay, aj) {
          if ((ai === 0 && aj === 0) || (ai === 0 && aj === last) || (ai === last && aj === 0)) return;
          for (var dy = -2; dy <= 2; dy++) for (var dx = -2; dx <= 2; dx++) set(ax + dx, ay + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
        });
      });
      function format(mask) {
        var dat = (0 << 3) | mask, rem = dat;   // nivel M = 00
        for (var i = 0; i < 10; i++) rem = (rem << 1) ^ ((rem >>> 9) * 0x537);
        var b = ((dat << 10) | rem) ^ 0x5412;
        function bit(i) { return ((b >>> i) & 1) !== 0; }
        for (i = 0; i <= 5; i++) set(8, i, bit(i));
        set(8, 7, bit(6)); set(8, 8, bit(7)); set(7, 8, bit(8));
        for (i = 9; i < 15; i++) set(14 - i, 8, bit(i));
        for (i = 0; i < 8; i++) set(size - 1 - i, 8, bit(i));
        for (i = 8; i < 15; i++) set(8, size - 15 + i, bit(i));
        set(8, size - 8, true);
      }
      format(0);
      if (v >= 7) {
        var rem = v;
        for (i = 0; i < 12; i++) rem = (rem << 1) ^ ((rem >>> 11) * 0x1F25);
        var vb = (v << 12) | rem;
        for (i = 0; i < 18; i++) { var bt = ((vb >>> i) & 1) !== 0, a = size - 11 + i % 3, bb = Math.floor(i / 3); set(a, bb, bt); set(bb, a, bt); }
      }
      // Datos en zigzag.
      var n = 0;
      for (var right = size - 1; right >= 1; right -= 2) {
        if (right === 6) right = 5;
        for (var vert = 0; vert < size; vert++) for (j = 0; j < 2; j++) {
          var xx = right - j, up = ((right + 1) & 2) === 0, yy = up ? size - 1 - vert : vert;
          if (!fn[yy][xx] && n < cw.length * 8) { m[yy][xx] = ((cw[n >>> 3] >>> (7 - (n & 7))) & 1) !== 0; n++; }
        }
      }
      function applyMask(k) {
        for (var y = 0; y < size; y++) for (var x = 0; x < size; x++) {
          if (fn[y][x]) continue;
          var inv = k === 0 ? (x + y) % 2 === 0 : k === 1 ? y % 2 === 0 : k === 2 ? x % 3 === 0 : k === 3 ? (x + y) % 3 === 0 :
                    k === 4 ? (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0 : k === 5 ? x * y % 2 + x * y % 3 === 0 :
                    k === 6 ? (x * y % 2 + x * y % 3) % 2 === 0 : ((x + y) % 2 + x * y % 3) % 2 === 0;
          if (inv) m[y][x] = !m[y][x];
        }
      }
      // Penalización simplificada (rachas, bloques 2x2 y equilibrio): cualquier máscara es válida,
      // esto solo elige la que se lee más fácil.
      function penalty() {
        var p = 0, dark = 0, y, x, run, c;
        for (y = 0; y < size; y++) for (run = 1, x = 1; x <= size; x++) {
          if (x < size && m[y][x] === m[y][x - 1]) run++; else { if (run >= 5) p += run - 2; run = 1; }
        }
        for (x = 0; x < size; x++) for (run = 1, y = 1; y <= size; y++) {
          if (y < size && m[y][x] === m[y - 1][x]) run++; else { if (run >= 5) p += run - 2; run = 1; }
        }
        for (y = 0; y < size - 1; y++) for (x = 0; x < size - 1; x++) {
          c = m[y][x]; if (c === m[y][x + 1] && c === m[y + 1][x] && c === m[y + 1][x + 1]) p += 3;
        }
        for (y = 0; y < size; y++) for (x = 0; x < size; x++) if (m[y][x]) dark++;
        return p + Math.floor(Math.abs(dark * 20 - size * size * 10) / (size * size)) * 10;
      }
      var best = forceMask, bestP = 1e9;
      if (best === undefined) for (var k2 = 0; k2 < 8; k2++) {
        applyMask(k2); format(k2);
        var pp = penalty(); if (pp < bestP) { bestP = pp; best = k2; }
        applyMask(k2);
      }
      applyMask(best); format(best);
      return m;
    }
    function svg(text, px) {
      var m = matrix(text), size = m.length, q = 4, all = size + q * 2, d = '';
      for (var y = 0; y < size; y++) for (var x = 0; x < size; x++) if (m[y][x]) d += 'M' + (x + q) + ',' + (y + q) + 'h1v1h-1z';
      return '<svg xmlns="http://www.w3.org/2000/svg" width="' + px + '" height="' + px + '" viewBox="0 0 ' + all + ' ' + all +
        '" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path d="' + d + '" fill="#000"/></svg>';
    }
    return { matrix: matrix, svg: svg };
  })();

  // ---------- Código QR (?qr=1) ----------
  if (q.get('qr') === '1') {
    document.body.classList.add('qr');
    fetch(API + 'estado', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (s) {
      if (!s.lan) {
        $('qrurl').textContent = '';
        $('qrnote').innerHTML = T('Primero activa <b>Permitir desde el móvil</b> en Vortexs Live → pestaña Mando, y vuelve a pulsar «Código QR».');
        $('qr').style.display = 'none';
        return;
      }
      $('qrurl').textContent = s.lan;
      // El QR se genera aquí mismo: sin internet y sin cargar código de fuera (la URL lleva la clave del mando).
      try { $('qr').innerHTML = QR.svg(s.lan, 260); }
      catch (e) { $('qr').style.display = 'none'; $('qrnote').textContent = T('No se pudo dibujar el QR: escribe la dirección de arriba en el navegador del móvil.'); }
    });
    return;
  }

  // ---------- Sonido de aviso ----------
  var sndOn = true;
  try { sndOn = localStorage.getItem('sd-mando-sonido') !== '0'; } catch (x) {}
  $('snd').checked = sndOn;
  $('snd').onchange = function () { sndOn = this.checked; try { localStorage.setItem('sd-mando-sonido', sndOn ? '1' : '0'); } catch (x) {} unlock(); };
  var ctx = null;
  function unlock() { try { if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)(); if (ctx.state === 'suspended') ctx.resume(); } catch (x) {} }
  document.addEventListener('pointerdown', unlock, { once: false, passive: true });
  function beep() {
    if (!sndOn || !ctx) return;
    [[988, 0, .16], [740, .22, .22]].forEach(function (n) {
      var o = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime + n[1];
      o.frequency.value = n[0]; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.35, t + .01); g.gain.linearRampToValueAtTime(0, t + n[2]);
      o.start(t); o.stop(t + n[2] + .02);
    });
    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
  }

  var toastT;
  function toast(m) { var t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(function () { t.classList.remove('show'); }, 1800); }

  // ---------- Pintar el estado ----------
  var lastSeq = null, ST = { live: T('En directo'), retry: T('Reintentando'), connecting: T('Conectando'), wait: T('Esperando'), ready: T('Preparado'), nokey: T('Sin clave'), off: T('Parado') };
  var TR = { on: T('Activando delay'), up: T('Subiendo delay'), down: T('Bajando delay'), off: T('Delay quitado') };
  function render(s) {
    if (!s || s.error) { if (s && s.error) toast(s.error); return; }
    var hero = $('hero'), t = s.tr && TR[s.tr.k] ? s.tr : null;
    hero.className = 'card ' + (s.on ? 'on' : 'off') + (t ? ' tr' : '');
    $('heroLbl').textContent = t ? TR[t.k] : s.on ? T('Delay activado') : 'Delay';
    $('state').innerHTML = s.on ? secs(s.s) : T('Sin delay');
    $('bar').style.width = t ? Math.round(t.p * 100) + '%' : '0';
    var nLive = (s.dests || []).filter(function (d) { return d.st === 'live'; }).length;
    $('sub').innerHTML = !s.running ? T('Servicio parado en Vortexs Live') : !s.input ? T('Esperando a OBS…') :
      nLive ? '<span class="live">● ' + (LANG === 'en' ? 'LIVE' : 'EN DIRECTO') + '</span>' + T(' en ') + nLive + (nLive === 1 ? T(' plataforma') : T(' plataformas')) + (s.on ? T(' · tu público va ') + s.s + T(' s por detrás') : '') :
      T('OBS conectado · llenando el delay');
    var tg = $('toggle');
    tg.textContent = s.on ? T('Quitar delay') : T('Activar delay') + (s.s > 0 ? ' (' + s.s + ' s)' : '');
    tg.className = 'big ' + (s.on ? 'stop' : 'go');

    var pre = $('presets');
    if (pre.children.length !== (s.presets || []).length) {
      pre.innerHTML = '';
      (s.presets || []).forEach(function (p, i) {
        var b = document.createElement('button'); b.className = 'pre';
        b.onclick = function () { act('preset&n=' + (i + 1)); };
        pre.appendChild(b);
      });
    }
    (s.presets || []).forEach(function (p, i) { var b = pre.children[i]; b.textContent = p.n; b.classList.toggle('sel', !!p.sel); });

    $('dests').innerHTML = (s.dests || []).length ? s.dests.map(function (d) {
      return '<div class="dest"><b>' + esc(d.name) + '</b>' + (d.q ? '<span class="q">' + esc(d.q) + '</span>' : '') +
        '<span class="chip ' + d.st + '">' + (d.st === 'retry' && d.note ? esc(d.note) : ST[d.st] || d.st) + '</span></div>';
    }).join('') : '<div class="empty">' + T('No hay destinos activados.') + '</div>';

    var pr = s.problems || [];
    $('alert').classList.toggle('show', pr.length > 0);
    $('alertTxt').innerHTML = pr.map(esc).join('<br>');
    $('events').innerHTML = (s.events || []).length ? s.events.slice(0, 6).map(function (e) {
      return '<div class="ev ' + esc(e.lv) + '"><time>' + esc(e.t) + '</time><span>' + esc(e.m) + '</span></div>';
    }).join('') : '<div class="empty">' + T('Todo en orden.') + '</div>';
    if (lastSeq !== null && s.seq > lastSeq) beep();
    lastSeq = s.seq;
    $('ver').textContent = 'v' + s.ver;
  }

  function setConn(ok) { $('conn').className = 'conn ' + (ok ? 'ok' : 'bad'); $('connTxt').textContent = ok ? T('Conectado') : T('Sin conexión con Vortexs Live'); }
  function act(a) {
    unlock();
    if (navigator.vibrate) navigator.vibrate(15);
    return fetch(API + a, { cache: 'no-store' }).then(function (r) { return r.json(); })
      .then(function (s) { setConn(true); render(s); if (s.msg) toast(s.msg); })
      .catch(function () { setConn(false); toast(T('No se pudo contactar con Vortexs Live')); });
  }
  function poll() {
    fetch(API + 'estado', { cache: 'no-store' }).then(function (r) { if (r.status === 403) throw 'k'; return r.json(); })
      .then(function (s) { setConn(true); render(s); })
      .catch(function (e) { setConn(false); if (e === 'k') $('connTxt').textContent = T('Clave incorrecta: copia de nuevo la URL'); })
      .then(function () { setTimeout(poll, 1000); });
  }

  $('toggle').onclick = function () { act('toggle'); };
  Array.prototype.forEach.call(document.querySelectorAll('[data-a]'), function (b) { b.onclick = function () { act(b.dataset.a); }; });

  // Cortar ya: hay que mantenerlo pulsado 1,5 s para que no se pulse sin querer.
  var cut = $('cut'), fill = cut.querySelector('i'), holdT = null, holdStart = 0, raf = 0;
  function holdStep() {
    var p = Math.min(1, (Date.now() - holdStart) / 1500);
    fill.style.width = (p * 100) + '%';
    if (p >= 1) { stopHold(); act('cortar'); return; }
    raf = requestAnimationFrame(holdStep);
  }
  function startHold(e) { e.preventDefault(); holdStart = Date.now(); cancelAnimationFrame(raf); raf = requestAnimationFrame(holdStep); }
  function stopHold() { cancelAnimationFrame(raf); fill.style.width = '0'; }
  cut.addEventListener('pointerdown', startHold);
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (ev) { cut.addEventListener(ev, stopHold); });
  cut.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  poll();
})();
</script>
</body>
